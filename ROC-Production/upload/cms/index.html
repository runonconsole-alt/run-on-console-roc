/* ---------------------------------------------------------------- media */

function mediaUrl(m){ return m.file_url || m.url || ''; }
/* Thumbnail URL; after a Replace the version stops the browser showing the old picture. */
function mediaThumb(m){ return mediaUrl(m)+(m._v?'?v='+m._v:''); }

/* Alt text for images that are not CMS uploads. Product name cards show the product's
   name on the website; other site images get their alt text from each page's code.
   Neither is stored in the Media library, so neither counts as missing. */
function prepMedia(list){
  (list||[]).forEach(function(x){
    if(x.alt_text || x.folder==='uploads') return;
    var m=/^\/images\/products\/([a-z0-9-]+)\.(webp|svg)$/.exec(x.file_url||'');
    if(m){
      var p=S.prodNames&&S.prodNames[m[1]];
      x.card=m[1]; x.alt_auto=(p&&(p.image_alt||p.title))||m[1].replace(/-/g,' ');
    } else if(x.folder==='site') x.alt_auto='Written in the page code where the image is used';
  });
  return list||[];
}
function hasAlt(x){ return !!(x.alt_text||x.alt_auto); }
async function loadProdNames(){
  if(S.prodNames || !can('products','view')) return;
  try{
    var d=await api('products.php'); S.prodNames={};
    (d.products||[]).forEach(function(p){ S.prodNames[p.slug]={title:p.title,image_alt:p.image_alt,id:p.id}; });
    prepMedia(S.media.map(function(x){ delete x.alt_auto; return x; }));
  }catch(e){}
}
var REPLACE_TYPES='image/jpeg,image/png,image/webp';

function mediaBadge(x){
  var big=+x.file_size>102400;
  return (big?'<span class="flag">'+bytes(x.file_size)+'</span>':'')+
    (x.usage? (x.usage.length?'<span class="flag used">used · '+x.usage.length+'</span>':'<span class="flag unused">not used</span>'):'')+
    (x.card?'<span class="flag lock">name card</span>':x.locked?'<span class="flag lock">site build</span>':'');
}
function mediaMatches(x){
  var f=S.mfilter;
  if(f==='uploads' && x.folder!=='uploads') return false;
  if(f==='site' && x.folder!=='site') return false;
  if(f==='heavy' && !(+x.file_size>102400)) return false;
  if(f==='noalt' && hasAlt(x)) return false;
  if(f==='unused' && !(x.usage && !x.usage.length)) return false;
  if(S.mq && (x.filename+' '+x.file_url+' '+(x.alt_text||x.alt_auto||'')).toLowerCase().indexOf(S.mq.toLowerCase())===-1) return false;
  return true;
}

async function renderMedia(m){
  if(!S.mediaLoaded){
    m.innerHTML = head('Media library','Scanning the website…')+
      '<div class="body"><div class="card"><div class="empty"><span class="spin"></span>'+
      '<div style="margin-top:10px">Finding every image and where it is used…</div></div></div></div>';
    try{ var d=await api('media.php'); await loadProdNames(); S.media=prepMedia(d.media); S.mcan=d.can||{}; S.mediaLoaded=true; }
    catch(e){ toast(e.message,'bad'); return; }
    if(S.view!=='media' || S.editing) return;
  }
  var all=S.media, rows=all.filter(mediaMatches);
  var heavy=all.filter(function(x){return +x.file_size>102400;});
  var noAlt=all.filter(function(x){return !hasAlt(x);});
  var counts={all:all.length,
    uploads:all.filter(function(x){return x.folder==='uploads';}).length,
    site:all.filter(function(x){return x.folder==='site';}).length,
    heavy:heavy.length, noalt:noAlt.length,
    unused:all.filter(function(x){return x.usage&&!x.usage.length;}).length};
  var labels={all:'All',uploads:'Uploaded in CMS',site:'Site images',heavy:'Over 100 KB',noalt:'No alt text',unused:'Not used'};

  m.innerHTML = head('Media library', rows.length+' of '+all.length+' images',
    can('media','upload')?'<button class="btn primary" id="up">＋ Upload</button>':'')+
  '<div class="body">'+
  (heavy.length?'<div class="card"><div class="cbody"><div class="advice">'+
    '<div class="a warn"><span class="m">▲</span><span><b>'+heavy.length+'</b> image(s) are over 100 KB and slow the site down. '+
    'New uploads are converted to WebP and kept under 100 KB automatically. For a heavy image already on a page, upload a smaller version and swap it in.</span></div>'+
    '</div></div></div>':'')+
  '<div class="card"><div class="chead" style="flex-wrap:wrap;gap:10px">'+
    '<div class="search" style="max-width:260px;flex:1"><input type="text" id="mq" placeholder="Search file name or alt text" value="'+esc(S.mq)+'"></div>'+
    '<div class="chips">'+Object.keys(labels).map(function(k){
      return '<button class="chip'+(S.mfilter===k?' on':'')+'" data-mf="'+k+'">'+labels[k]+'<span class="n">'+counts[k]+'</span></button>';
    }).join('')+'</div></div><div class="cbody">'+
  '<input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>'+
  (rows.length?'<div class="mgrid">'+rows.map(function(x){
    return '<div class="mitem" data-m="'+esc(x.id)+'">'+
      '<div class="mthumb" style="background-image:url(\''+esc(mediaThumb(x))+'\')">'+mediaBadge(x)+'</div>'+
      '<div class="mmeta"><div class="mname" title="'+esc(x.file_url)+'">'+esc(x.filename)+'</div>'+
      '<div class="msub">'+(x.width?x.width+'×'+x.height+' · ':'')+bytes(x.file_size)+
      (hasAlt(x)?'':' <span class="noalt">· no alt</span>')+'</div></div></div>';
  }).join('')+'</div>'
  :'<div class="empty"><div class="big">❖</div><div>No images match.</div></div>')+
  '</div></div></div>';

  var mq=$('#mq',m);
  mq.addEventListener('input',function(){ S.mq=mq.value; var at=mq.selectionStart; renderMedia(m);
    var f=$('#mq',m); if(f){f.focus();f.setSelectionRange(at,at);} });
  m.querySelectorAll('[data-mf]').forEach(function(b){ b.addEventListener('click',function(){ S.mfilter=b.dataset.mf; renderMedia(m); }); });
  var input=$('#file',m), up=$('#up',m);
  if(up){
    up.addEventListener('click',function(){ input.click(); });
    input.addEventListener('change', async function(){
      var files=Array.prototype.slice.call(input.files||[]);
      for(var i=0;i<files.length;i++) await uploadOne(files[i]);
      input.value=''; S.mediaLoaded=false; renderShell();
    });
  }
  m.querySelectorAll('[data-m]').forEach(function(el){
    el.addEventListener('click',function(){ mediaDetail(el.dataset.m); });
  });
}

async function uploadOne(file){
  if(REPLACE_TYPES.split(',').indexOf(file.type)===-1){ toast(file.name+': only JPG, PNG or WebP images can be uploaded.','bad'); return null; }
  if(file.size>16*1024*1024){ toast(file.name+': larger than the 16 MB upload limit.','bad'); return null; }
  var fd=new FormData(); fd.append('file',file);
  try{
    var res=await fetch(API+'media.php',{method:'POST',headers:{'X-CMS-CSRF-Token':S.csrf},body:fd});
    var d=await res.json();
    if(!d.success) throw new Error(d.error||'Upload failed.');
    toast(file.name+' uploaded'+(d.notes&&d.notes.length?' — '+d.notes.join(' '):'.'),'good');
    return d.media;
  }catch(e){ toast(file.name+': '+e.message,'bad'); return null; }
}

async function refreshMedia(){

}

  var rb=$('#m-rep'), rf=$('#m-repf');
  if(rb) rb.addEventListener('click',function(){ rf.click(); });

    var file=rf.files&&rf.files[0]; rf.value='';

      var res=await fetch(API+'media-replace.php',{method:'POST',headers:{'X-CMS-CSRF-Token':S.csrf},body:fd,credentials:'same-origin'});

async function deleteMedia(x, close){
  if(x.locked){ toast('This image is part of the built website and cannot be deleted here.','bad'); return; }
  if(!confirm('Delete '+x.filename+'?\n\nThe file is moved to the server trash folder (~/roc-media-trash), so it can be restored by hand.'))return;
  try{
    var r=await api('media.php',{action:'delete',file_url:x.file_url});
    toast(r.message,'good');
  }catch(e){
    if(e.code==='IN_USE' && e.data && e.data.usage){
      var list=e.data.usage.map(function(u){return '• '+u.label+': '+u.title;}).join('\n');
      if(!confirm('This image is still used on '+e.data.usage.length+' page(s):\n\n'+list+
        '\n\nThose pages will show a broken image until you choose another one. Delete anyway?')) return;
      try{ var r2=await api('media.php',{action:'delete',file_url:x.file_url,confirm_in_use:true}); toast(r2.message,'good'); }
      catch(e2){ toast(e2.message,'bad'); return; }
    } else { toast(e.message,'bad'); return; }
  }
  close(); S.mediaLoaded=false;
  S.media=S.media.filter(function(v){return v.file_url!==x.file_url;});
  renderShell();
}

function accessSummary(u){
  if(u.role==='administrator') return '<span class="tag admin">Full access</span>';
  var parts=[];
  (S.sections||[]).forEach(function(sec){
    var a=(u.permissions||{})[sec.key];
    if(a&&a.length) parts.push('<b>'+esc(sec.label)+'</b>: '+esc(a.join(', ')));
  });
  return parts.length?'<div style="font-size:12px;line-height:1.6">'+parts.join('<br>')+'</div>':'<span class="hint bad">No access</span>';
}

    '<button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="save">'+(isNew?'Create user':'Save access')+'</button>',

      '<div id="s-img" style="width:120px;height:63px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg) center/cover no-repeat;background-image:url(\''+esc(val.og_image||d.og_image)+'\')"></div>'+

/* Products, product categories and gaming platforms are served from the CMS database now. */
function cmsEditTarget(url){
  var r;
  if((r=/^\/products\/category\/([a-z0-9-]+)\/$/.exec(url))) return {type:'pcat', id:r[1], label:'Product category'};
  if((r=/^\/products\/([a-z0-9-]+)\/$/.exec(url))) return {type:'product', id:r[1], label:'Product'};
  if((r=/^\/(?:categories|gaming-platforms)\/([a-z0-9-]+)\/$/.exec(url))) return {type:'platform', id:r[1], label:'Gaming platform'};
  return null;
}

async function renderPages(m, embedded){
  var VIEW=embedded?'cmspages':'pages';
  if(!S.sitePages){
    m.innerHTML=embedded?'<div class="card"><div class="empty"><span class="spin"></span> Reading the website pages…</div></div>':head('Website pages','Scanning…','')+'<div class="body"><div class="card"><div class="empty"><span class="spin"></span></div></div></div>';
    try{ S.sitePages=(await api('site-pages.php')).pages||[]; }catch(e){ toast(e.message,'bad'); return; }
    try{ var sd=await api('page-seo.php'); S.seo={}; S.seoCan=sd.can_edit; (sd.pages||[]).forEach(function(x){ S.seo[x.path]=x; }); }
    catch(e){ S.seo=null; }
    S.sitePagesN=S.sitePages.length; var badge=document.querySelector('[data-go="cmspages"] .ct'); if(badge) badge.textContent=S.pages.length+S.sitePagesN;
    if(S.view!==VIEW || !m.isConnected) return;
  }
  var groups=['all'].concat(S.sitePages.map(function(p){return p.group;}).filter(function(g,i,a){return a.indexOf(g)===i;}));

var ACT_TYPES={signup:{label:'Sign-ups',icon:'👤',bg:'#dbeafe'},comment:{label:'Comments',icon:'💬',bg:'#fef3c7'},
  request:{label:'Requests',icon:'✉️',bg:'#ede9fe'},alert:{label:'Price alerts',icon:'🔔',bg:'#fee2e2'},
  save:{label:'Saved products',icon:'★',bg:'#fce7f3'},chat:{label:'AI chats',icon:'🤖',bg:'#e0f2fe'},
  click:{label:'Buy clicks',icon:'🛒',bg:'#d1fae5'}};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function ago(at){
  var t=new Date(String(at).replace(' ','T')+'Z').getTime(), now=Date.now()-(S.actSkew||0), s=Math.max(0,(now-t)/1000);
  if(isNaN(t)) return at;
  return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':Math.floor(s/86400)+' d ago';
}
async function pollActivity(){
  if(!can('activity','view')) return;
  try{
    var d=await api('activity.php');
    // server_time is UTC-less local server time; measure skew so "x min ago" is right.
    if(d.server_time) S.actSkew=Date.now()-new Date(d.server_time.replace(' ','T')+'Z').getTime();
    var items=d.items||[], seen=lsGet('roc_act_seen')||'', prevNewest=S.actNewest;
    S.activity=items; S.actCounts=d.counts_24h||{};
    S.actNewest=items.length?items[0].at:(prevNewest||'');
    if(!seen && items.length){ seen=items[0].at; lsSet('roc_act_seen',seen); }
    S.actUnseen=items.filter(function(i){return i.at>seen;}).length;
    if(prevNewest && S.actNotify && window.Notification && Notification.permission==='granted'){
      items.filter(function(i){return i.at>prevNewest;}).slice(0,3).forEach(function(i){
        try{ new Notification('Run On Console — '+(ACT_TYPES[i.type]||{}).label, {body:i.title+(i.detail?'\n'+i.detail:''), icon:'/favicon.svg'}); }catch(e){}
      });
    }
    var b=document.querySelector('.sitem[data-go=activity]');
    if(b){ var ct=b.querySelector('.ct');
      if(S.actUnseen){ if(!ct){ ct=document.createElement('span'); ct.className='ct new'; b.appendChild(ct);} ct.textContent=S.actUnseen; }
      else if(ct) ct.remove(); }
    if(S.view==='activity' && !S.editing) paintActivity($('#main'));
    if(S.view==='dashboard' && !S.editing && !S.dashActDone && !document.querySelector('.veil')){ S.dashActDone=true; renderView(); }
  }catch(e){}
}
function startActivityPolling(){
  if(S.actTimer || !can('activity','view')) return;
  S.actNotify=lsGet('roc_act_notify')==='1';
  pollActivity();
  S.actTimer=setInterval(pollActivity, 30000);
}
function renderActivity(m){
  m.innerHTML=head('Live activity','What visitors are doing on runonconsole.com · updates every 30 seconds',
    '<button class="btn" id="actnotify"></button><button class="btn" id="actnow">Refresh</button>')+
    '<div class="body narrow" id="actbody"><div class="card"><div class="empty"><span class="spin"></span></div></div></div>';
  $('#actnow',m).addEventListener('click',pollActivity);
  var nb=$('#actnotify',m);
  function label(){ nb.textContent=S.actNotify?'🔔 Notifications on':'🔕 Turn on notifications'; }
  label();
  nb.addEventListener('click',function(){
    if(!window.Notification){ toast('This browser does not support notifications.','bad'); return; }
    if(S.actNotify){ S.actNotify=false; lsSet('roc_act_notify','0'); label(); return; }
    Notification.requestPermission().then(function(p){
      S.actNotify=p==='granted'; lsSet('roc_act_notify',S.actNotify?'1':'0'); label();
      if(!S.actNotify) toast('Notifications are blocked in this browser. Allow them in the site settings.','bad');
    });
  });
  if(S.activity) paintActivity(m); else pollActivity();
}
function paintActivity(m){
  var body=$('#actbody',m); if(!body) return;
  var items=S.activity||[], f=S.actFilter||'all', seen=lsGet('roc_act_seen')||'';
  var rows=items.filter(function(i){return f==='all'||i.type===f;});
  var c=S.actCounts||{};
  var html='<div class="stats">'+Object.keys(ACT_TYPES).map(function(k){
      return '<div class="stat"><div class="n">'+(c[k]||0)+'</div><div class="l">'+ACT_TYPES[k].label+' · 24h</div></div>'; }).join('')+'</div>'+
    '<div class="card"><div class="chead"><div class="chips">'+['all'].concat(Object.keys(ACT_TYPES)).map(function(k){
      return '<button class="chip'+(f===k?' on':'')+'" data-af="'+k+'">'+(k==='all'?'All':ACT_TYPES[k].label)+'</button>'; }).join('')+'</div></div>';
  if(!rows.length) html+='<div class="empty"><div class="big">⚡</div><div>No activity in the last 30 days'+(f==='all'?'':' for this filter')+'.</div></div>';
  var day='';

    if(d!==day){ day=d; html+='<div class="dayh">'+when(i.at)+'</div>'; }

      '<div style="min-width:0"><div class="t">'+esc(i.title)+'</div>'+(i.detail?'<div class="d">'+esc(i.detail)+'</div>':'')+
      (i.link?'<div class="d"><a href="'+esc(i.link)+'" target="_blank" rel="noopener">'+esc(i.link)+' ↗</a></div>':'')+'</div>'+
      '<div class="w" title="'+esc(i.at)+'">'+ago(i.at)+'</div></div>';
  });
  body.innerHTML=html+'</div><div class="hint">Buy clicks show that someone clicked through to a store. Actual sales are reported in your Amazon Associates / store affiliate dashboard.</div>';
  body.querySelectorAll('[data-af]').forEach(function(b){ b.addEventListener('click',function(){ S.actFilter=b.dataset.af; paintActivity(m); }); });
  // Opening the page marks everything as seen.
  if(items.length && S.view==='activity'){ lsSet('roc_act_seen',items[0].at); S.actUnseen=0;
    var ct=document.querySelector('.sitem[data-go=activity] .ct'); if(ct) ct.remove(); }
}

/* Title and description of every page (api/v1/cms/page-metas.php). The "Live now"
   line is read from the live page itself, so it always shows what Google sees. */

var metaLive={};          // path -> {t, d} read from the live page
var metaQueue=[], metaBusy=0;
function metaFetchLive(path, cb, force){
  if(metaLive[path] && !force) return cb(metaLive[path]);
  metaQueue.push([path,cb]); metaPump();
}
function metaPump(){
  while(metaBusy<4 && metaQueue.length){
    var job=metaQueue.shift(); metaBusy++;
    (function(path,cb){
      fetch(path,{credentials:'same-origin',cache:'no-store'}).then(function(r){ return r.ok?r.text():Promise.reject(r.status); })
      .then(function(h){
        var doc=new DOMParser().parseFromString(h,'text/html');
        var d=doc.querySelector('meta[name="description"]');
        metaLive[path]={t:(doc.title||'').trim(), d:d?(d.getAttribute('content')||'').trim():'', ok:true};
      }).catch(function(e){ metaLive[path]={t:'',d:'',ok:false,err:String(e)}; })
      .then(function(){ metaBusy--; cb(metaLive[path]); metaPump(); });
    })(job[0],job[1]);
  }
}
function metaLen(n,max){ return '<span class="hint" style="color:'+(n===0?'var(--ink-3)':n>max?'#e11d48':'#059669')+'">'+n+' / '+max+'</span>'; }

        '<div class="field" style="margin-bottom:0"><textarea data-md rows="3" maxlength="500">'+esc(r.description||c.d)+'</textarea><div class="hint" data-mdl></div></div>';

        var wt=ti.value.trim().split(/\s+/).filter(Boolean).length, wd=de.value.trim().split(/\s+/).filter(Boolean).length;
        $('[data-mtl]',body).innerHTML=metaLen(ti.value.length,60)+' <span class="hint">characters · '+wt+' words</span>';
        $('[data-mdl]',body).innerHTML=metaLen(de.value.length,160)+' <span class="hint">characters · '+wd+' words</span>';
      }

        toast(res.message,'good');
        body.innerHTML='<span class="hint"><span class="spin" style="width:10px;height:10px"></span> checking the live page…</span>';
        metaFetchLive(r.path,function(l){
          live=l;

          note=ok?'<b style="color:#059669">✓ Saved. The live page now shows this.</b>':'<b style="color:#b45309">Saved; the live page has not picked it up yet.</b>';
          view();
        },true);
      }catch(e){ toast(e.message,'bad'); btns.querySelectorAll('button').forEach(function(b){ b.disabled=false; }); }
    }

    async function history(){
      if(hrow.style.display!=='none'){ hrow.style.display='none'; return; }
      hrow.style.display=''; hb.innerHTML='<span class="spin" style="width:10px;height:10px"></span>';
      try{

        hb.innerHTML='<div class="hint"><b>Earlier versions</b> (last '+h.days+' days)</div>'+metaHistHtml(h.history,false);
        bindMetaRestore(hb,function(res){
          r.title=res.title; r.description=res.description; hrow.style.display='none';
          metaFetchLive(r.path,function(l){ live=l; note='<b style="color:#059669">✓ Earlier version restored.</b>'; view(); },true);
        });
      }catch(e){ hb.innerHTML='<div class="hint">'+esc(e.message)+'</div>'; }
    }

    metaFetchLive(r.path,function(l){ live=l; view(); });
  });
}

  var len=(t+x+(a.link_url?(a.link_text||'Learn more'):'')).length, sp=Math.max(1,Math.min(5,+a.speed||3));

  var inner=(a.icon?esc(a.icon)+' ':'')+(t?'<strong style="font-weight:800">'+esc(t)+'</strong>':'')+(t&&x?' — ':'')+esc(x)+
    (a.link_url?' <u style="font-weight:700;margin-left:6px">'+esc(a.link_text||'Learn more')+'</u>':'');
  return '<style>@keyframes roc-ann-run{from{transform:translateX(0)}to{transform:translateX(-100%)}}</style>'+
    '<div style="position:relative;overflow:hidden;background:'+esc(a.bg)+';color:'+esc(a.fg)+';font:500 13px/1.45 Inter,system-ui,sans-serif;padding:10px 46px 10px 16px;text-align:'+(a.scroll?'left;white-space:nowrap':'center')+';border-radius:10px">'+

}
function toLocalInput(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; d=new Date(d.getTime()-d.getTimezoneOffset()*60000); return d.toISOString().slice(0,16); }

/* Custom CSS and HTML added to every page (api/v1/cms/site-layer.php). */

/* ------------------------------------------------------------- history */
/* Earlier versions kept 30 days on the server (site-layer-lib.php rocHistAdd). */

function histWhen(iso){ var d=new Date(iso); return isNaN(d)?esc(iso):d.toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function histMeta(v){
  v=v||{}; return '<div><b>'+(v.title?esc(v.title):'<i style="color:var(--ink-3)">automatic title</i>')+'</b></div>'+
    '<div style="color:var(--ink-3)">'+(v.description?esc(v.description):'<i>automatic description</i>')+'</div>';
}
/* List of meta changes; onRestore(row) after a restore. */
function metaHistHtml(list, showPage){
  if(!list.length) return '<div class="hint">No earlier versions in the last 30 days.</div>';
  return list.map(function(h){
    return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12.5px">'+
      '<div class="hint" style="margin-bottom:6px">'+histWhen(h.at)+(h.user&&isNaN(h.user)?' · '+esc(h.user):'')+(showPage?' · <b>'+esc(h.label)+'</b>':'')+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
        '<div><div class="hint">Before</div>'+histMeta(h.before)+'<button class="btn sm" style="margin-top:6px" data-hrest="'+esc(h.id)+'" data-which="before">Restore this</button></div>'+
        '<div><div class="hint">Changed to</div>'+histMeta(h.after)+'<button class="btn sm" style="margin-top:6px" data-hrest="'+esc(h.id)+'" data-which="after">Restore this</button></div>'+
      '</div></div>';
  }).join('');
}
function bindMetaRestore(box, done){
  box.querySelectorAll('[data-hrest]').forEach(function(b){ b.addEventListener('click',async function(){
    if(!confirm('Put this title and description back on the live page? The current one stays in the archive.')) return;
    try{ var r=await api('page-metas.php',{action:'restore',id:b.dataset.hrest,which:b.dataset.which}); toast(r.message,'good'); done(r); }
    catch(e){ toast(e.message,'bad'); }
  }); });
}
async function metaArchive(m){
  var d; try{ d=await api('page-metas.php?history=all'); }catch(e){ toast(e.message,'bad'); return; }
  m.innerHTML=head('Metas archive','Every title and description change of the last '+d.days+' days','<button class="btn" id="mback">‹ Back to Metas</button>')+
    '<div class="body narrow"><div class="card"><div class="cbody" id="mhist">'+metaHistHtml(d.history,true)+'</div></div></div>';
  $('#mback',m).addEventListener('click',function(){ S.metaRows=null; renderMetas(m); });
  bindMetaRestore($('#mhist',m), function(){ metaLive={}; metaArchive(m); });
}

/* Versions of the announcement or the site code. */
function layerHistHtml(list, kind){
  if(!list.length) return '<div class="hint">No earlier versions in the last 30 days.</div>';
  var desc=function(v){
    v=v||{};
    if(kind==='announcement') return (v.enabled?'<b style="color:#059669">shown</b>':'<b>hidden</b>')+' · '+esc(((v.title||'')+' '+(v.text||'')).trim().slice(0,90)||'(empty)');
    var parts=[['CSS',v.css],['head',v.head_html],['top',v.body_top_html],['bottom',v.body_end_html]].filter(function(x){return x[1];});
    return parts.length?parts.map(function(x){return esc(x[0])+' '+String(x[1]).length+' chars';}).join(' · '):'(all empty)';
  };
  return '<table class="list"><thead><tr><th>When</th><th>Before</th><th>Changed to</th></tr></thead><tbody>'+list.map(function(h){
    return '<tr><td style="white-space:nowrap">'+histWhen(h.at)+(h.user&&isNaN(h.user)?'<div class="hint">'+esc(h.user)+'</div>':'')+'</td>'+
      '<td>'+desc(h.before)+'<div><button class="btn sm" data-lrest="'+esc(h.id)+'" data-which="before" style="margin-top:4px">Restore</button></div></td>'+
      '<td>'+desc(h.after)+'<div><button class="btn sm" data-lrest="'+esc(h.id)+'" data-which="after" style="margin-top:4px">Restore</button></div></td></tr>';
  }).join('')+'</tbody></table>';
}
async function layerHistory(box, kind, reload, scope){
  box.innerHTML='<div class="empty"><span class="spin"></span></div>';
  var d; try{ d=await api('site-layer.php?history='+kind+(scope?'&scope='+encodeURIComponent(scope):'')); }catch(e){ box.innerHTML='<div class="hint">'+esc(e.message)+'</div>'; return; }
  box.innerHTML=layerHistHtml(d.history, kind);
  box.querySelectorAll('[data-lrest]').forEach(function(b){ b.addEventListener('click',async function(){
    if(!confirm('Put this version back on the website? What is live now stays in the archive.')) return;
    try{ var r=await api('site-layer.php',{action:'restore',id:b.dataset.lrest,which:b.dataset.which}); toast(r.message,'good');
      if(kind==='code') codeUndoSet(r.history_id, scope); reload(); }
    catch(e){ toast(e.message,'bad'); }
  }); });
}

/* --------------------------------------------- template: undo for 30 minutes */
var CODE_UNDO_MIN=30;
function codeUndoSet(id, scope){ try{ localStorage.setItem('roc-code-undo', JSON.stringify({id:id, scope:scope||'', at:Date.now()})); }catch(e){} }
function codeUndoGet(){
  try{ var u=JSON.parse(localStorage.getItem('roc-code-undo')||'null'); if(u&&u.id&&Date.now()-u.at<CODE_UNDO_MIN*60000) return u; }catch(e){}
  return null;
}
function clearLayerTimers(){ (S.layerTimers||[]).forEach(function(t){ clearInterval(t); clearTimeout(t); }); S.layerTimers=[]; var o=$('#idle-ov'); if(o) o.remove(); }

/* Which pages the code is for: the whole website, a group of pages, or one page. */
var CODE_GROUPS=[['*','🌐 Whole website (every page)'],['/products/*','All product and product category pages'],
  ['/blogs/*','All blog posts'],['/gaming-platforms/*','All gaming platform pages']];

async function renderSiteCode(m){
  clearLayerTimers();
  m.innerHTML=head('Template & code','Change the look of the website, or of one page, with your own CSS and HTML')+
    '<div class="body narrow"><div class="card"><div class="empty"><span class="spin"></span></div></div></div>';
  var d, pages=[];
  try{ d=await api('site-layer.php'); }catch(e){ toast(e.message,'bad'); return; }
  try{ pages=(await api('page-metas.php')).rows||[]; }catch(e){}
  if(S.view!=='sitecode') return;
  var scope=S.codeScope||'*';
  var codeOf=function(sc){ return sc==='*'?d.code:((d.code_pages||{})[sc]||{css:'',head_html:'',body_top_html:'',body_end_html:''}); };
  var has=function(sc){ var c=codeOf(sc); return !!(c.css||c.head_html||c.body_top_html||c.body_end_html); };
  var c=codeOf(scope);
  var nameOf=function(sc){
    var g=CODE_GROUPS.filter(function(x){return x[0]===sc;})[0]; if(g) return g[1];
    var p=pages.filter(function(x){return x.path===sc;})[0]; return p?p.label+' ('+sc+')':sc;
  };
  var opt=function(v,label){ return '<option value="'+esc(v)+'"'+(v===scope?' selected':'')+'>'+(has(v)?'● ':'')+esc(label)+'</option>'; };
  var seen={};
  var box=function(id,label,help,val,ph){
    return '<div class="field"><label for="'+id+'">'+label+'</label><div class="hint" style="margin:-2px 0 6px">'+help+'</div>'+
      '<textarea id="'+id+'" rows="7" spellcheck="false" style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:pre" placeholder="'+esc(ph)+'">'+esc(val)+'</textarea></div>';
  };
  var where=scope==='*'?'every page of the website':(scope.slice(-1)==='*'?nameOf(scope).toLowerCase():'this page only');
  $('.body',m).innerHTML=
    '<div id="sc-undo"></div>'+
    '<div class="card"><div class="cbody">'+
      '<div class="field" style="margin:0"><label for="sc-scope">1. Which page do you want to change?</label>'+
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
      '<select id="sc-scope" style="flex:1;min-width:260px">'+
        '<optgroup label="Many pages at once">'+CODE_GROUPS.map(function(g){ seen[g[0]]=1; return opt(g[0],g[1]); }).join('')+'</optgroup>'+
        '<optgroup label="One page">'+pages.filter(function(p){ if(seen[p.path]) return false; seen[p.path]=1; return true; })
          .map(function(p){ return opt(p.path,p.label+'  —  '+p.path); }).join('')+'</optgroup>'+
      '</select>'+
      (scope!=='*'&&scope.slice(-1)!=='*'?'<a class="btn sm" href="'+esc(scope)+'" target="_blank" rel="noopener">Open page ↗</a>':'')+'</div>'+
      '<div class="hint" style="margin-top:6px">● = has code already. The code below is added to <b>'+esc(where)+'</b>, on top of the whole-website code.</div></div></div></div>'+
    '<div class="alert info">2. Write your CSS or HTML and press <b>Save</b>: it is live straight away. '+
    'After saving you have <b>30 minutes</b> to undo with one click, and every earlier version stays in the archive below for <b>30 days</b>. '+
    'Empty a box and save to remove it.</div>'+
    '<div class="card"><div class="cbody"><form id="scf">'+
      box('sc-css','Custom CSS','Styles. Example: make the header darker, hide an element, change a colour.',
        c.css,'header { background: #022c22 !important; }\n.my-banner { padding: 12px; text-align: center; }')+
      box('sc-head','Code inside &lt;head&gt;','For meta tags, verification codes, fonts or tracking scripts.',
        c.head_html,'<meta name="p:domain_verify" content="…" />')+
      box('sc-top','HTML at the top of the page','Shown above the header (below the announcement bar).',
        c.body_top_html,'<div class="my-banner">Free shipping on all orders this week</div>')+
      box('sc-end','HTML at the bottom of the page','Added at the end of the page: chat widgets, scripts, extra divs.',
        c.body_end_html,'<div id="my-chat-widget"></div>')+
      '<button class="btn primary" type="submit">Save to website</button></form></div></div>'+
    '<div class="card"><div class="chead"><h3>Earlier versions of this code</h3><span class="note">Kept 30 days</span></div><div class="cbody" id="sc-hist"></div></div>';

  function reload(){ renderSiteCode(m); }
  layerHistory($('#sc-hist',m), 'code', reload, scope);

  var changed=false, idleT;
  $('#sc-scope',m).addEventListener('change',function(e){
    if(changed && !confirm('You have unsaved changes. Switch page anyway?')){ e.target.value=scope; return; }
    S.dirty=false; S.codeScope=e.target.value; reload();
  });

  // Undo strip: 30 minutes after the last save.
  function drawUndo(){
    var u=codeUndoGet(), el=$('#sc-undo',m); if(!el) return;
    if(!u){ el.innerHTML=''; return; }
    var left=Math.max(0, CODE_UNDO_MIN*60000-(Date.now()-u.at)), mm=Math.floor(left/60000), ss=Math.floor(left%60000/1000);
    el.innerHTML='<div class="alert" style="display:flex;gap:10px;align-items:center;justify-content:space-between;background:#ecfdf5;border-color:#a7f3d0">'+
      '<span>✓ Your last change'+(u.scope?' ('+esc(u.scope==='*'?'whole website':u.scope)+')':'')+' is live. You can undo it for <b>'+mm+':'+(ss<10?'0':'')+ss+'</b>.</span>'+
      '<button class="btn sm" id="sc-undo-btn">↶ Undo last change</button></div>';
    $('#sc-undo-btn',el).addEventListener('click',async function(){
      if(!confirm('Undo your last change? That page goes back to how it was before you saved.')) return;
      try{ await api('site-layer.php',{action:'restore',id:u.id,which:'before'}); try{ localStorage.removeItem('roc-code-undo'); }catch(e){}
        toast('Undone. The website is back to the previous version.','good'); reload(); }
      catch(e){ toast(e.message,'bad'); }
    });
  }
  drawUndo();
  S.layerTimers.push(setInterval(drawUndo, 1000));

  // Nothing changed for 1 minute: count down 5…1 and go back to where you came from.

      ov.innerHTML='<div class="card" style="max-width:380px;text-align:center;padding:26px"><div style="font-size:30px">⏱</div>'+
        '<h3 style="margin:8px 0">You have not changed anything</h3><div class="hint">Going back in</div>'+
        '<div id="idle-n" style="font-size:44px;font-weight:800;color:var(--brand,#059669)">5</div>'+
        '<button class="btn" id="idle-stay">Stay on Template & code</button></div>';
      document.body.appendChild(ov);
      var tick=setInterval(function(){
        n--; var el=$('#idle-n'); if(el) el.textContent=n;
        if(n<=0){ clearInterval(tick); ov.remove(); if(S.view==='sitecode' && !changed) go(S.prevView && S.prevView!=='sitecode' ? S.prevView : 'builder'); }
      },1000);
      S.layerTimers.push(tick);
      $('#idle-stay',ov).addEventListener('click',function(){ clearInterval(tick); ov.remove(); armIdle(); });
    }, 60000);
    S.layerTimers.push(idleT);
  }
  armIdle();
  $('#sc-scope',m).addEventListener('focus',function(){ clearTimeout(idleT); armIdle(); });
  $('#scf',m).addEventListener('input',function(){ changed=true; clearTimeout(idleT); S.dirty=true; });

  $('#scf',m).addEventListener('submit',async function(e){
    e.preventDefault();
    m.querySelectorAll('.publish-error').forEach(function(n){n.remove();});
    var v={css:$('#sc-css',m).value, head_html:$('#sc-head',m).value, body_top_html:$('#sc-top',m).value, body_end_html:$('#sc-end',m).value};
    try{
      var r=await api('site-layer.php',{part:'code',scope:scope,value:v});
      S.dirty=false;
      if(r.history_id) codeUndoSet(r.history_id, scope);
      toast(r.message+' You can undo it for 30 minutes.','good');
      reload();
    }catch(err){
      toast(err.message,'bad');
      var map={css:'sc-css',head_html:'sc-head',body_top_html:'sc-top',body_end_html:'sc-end'}, errs=(err.data&&err.data.errors)||{};
      Object.keys(errs).forEach(function(k){ var i=$('#'+map[k],m); if(!i) return;
        var n=document.createElement('div'); n.className='hint publish-error'; n.style.color='#e11d48'; n.textContent=errs[k]; i.parentNode.appendChild(n); });
    }
  });
}

function pkTime(utc){
  var d=new Date(String(utc).replace(' ','T')+(String(utc).indexOf('Z')===-1?'Z':''));
  return isNaN(d)?esc(utc):d.toLocaleString('en-GB',{timeZone:'Asia/Karachi',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}

function stageTag(s){ var x=STAGE_NAMES[s]||[s,'','#64748b']; return '<span class="tag" style="background:'+x[2]+'1a;color:'+x[2]+';border-color:'+x[2]+'55" title="'+esc(x[1])+'">'+x[0]+' · '+x[1]+'</span>'; }

      (d.free_slots&&d.free_slots.length?'<div class="hint" style="margin-top:8px">Next free times: '+d.free_slots.slice(0,4).map(esc).join(' · ')+'</div>':'')+
    '</div></div>';
  }

  function planCard(){
    var count=function(pid,stage,status){ return P.topics.filter(function(t){ return (!pid||t.pillar===pid)&&(!stage||t.stage===stage)&&(!status||t.status===status); }).length; };
    var rows=P.topics.filter(function(t){

      '<div class="hint" style="margin-bottom:10px">Every topic belongs to a <b>cluster</b> (a hub page plus its posts). Each post links up to its hub, to its products and to its sister posts, and the sister posts link back to it ("Keep reading"). '+

      (next?'<div class="alert info" style="margin-bottom:12px"><b>Next post:</b> '+esc(next.title)+'<br>'+stageTag(next.stage)+' <span class="hint">cluster: '+esc(pillarName[next.pillar]||next.pillar)+' · keyword: '+esc(next.keyword)+'</span></div>':'')+
      '<table class="list" style="margin-bottom:14px"><thead><tr><th>Cluster (hub page)</th><th>Learn</th><th>Compare</th><th>Buy</th></tr></thead><tbody>'+P.pillars.map(function(p){
        var c=function(s){ return '<b>'+count(p.id,s,'written')+'</b><span class="hint"> / '+count(p.id,s)+'</span>'; };
        return '<tr><td><a href="#" data-bacl="'+esc(p.id)+'" style="font-weight:600">'+esc(p.name)+'</a><div class="t-slug"><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.url)+' ↗</a></div></td><td>'+c('tofu')+'</td><td>'+c('mofu')+'</td><td>'+c('bofu')+'</td></tr>';
      }).join('')+'</tbody></table>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+
        '<select id="ba-fcl"><option value="all">All clusters</option>'+P.pillars.map(function(p){ return '<option value="'+esc(p.id)+'"'+(S.baCluster===p.id?' selected':'')+'>'+esc(p.name)+'</option>'; }).join('')+'</select>'+
        '<select id="ba-fst"><option value="all">All stages</option>'+['tofu','mofu','bofu'].map(function(s){ return '<option value="'+s+'"'+(S.baStage===s?' selected':'')+'>'+STAGE_NAMES[s][0]+' · '+STAGE_NAMES[s][1]+'</option>'; }).join('')+'</select>'+
        '<select id="ba-fss">'+[['planned','Planned'],['written','Written'],['skipped','Skipped'],['all','All']].map(function(x){ return '<option value="'+x[0]+'"'+(S.baStatus===x[0]?' selected':'')+'>'+x[1]+'</option>'; }).join('')+'</select>'+
        '<button class="btn" id="ba-refresh" title="Adds topics for new products and categories; keeps what is written">↻ Refresh plan from products</button></div>'+
      '<table class="list"><thead><tr><th>Topic</th><th>Stage</th><th>Status</th><th></th></tr></thead><tbody>'+

  function pcCard(){
    return '<details class="card" style="padding:0"'+(engine==='pc'||fresh?' open':'')+'><summary class="chead" style="cursor:pointer;list-style:none"><h3>PC writer connection (Claude app)</h3><span class="note">'+

    box.querySelectorAll('[data-ti]').forEach(function(x){ x.addEventListener('change',function(){ times[+x.dataset.ti]=x.value; }); });
    box.querySelectorAll('[data-trm]').forEach(function(x){ x.addEventListener('click',function(){ times.splice(+x.dataset.trm,1); drawTimes(); }); });

    if(btn){ btn.disabled=true; var old=btn.textContent; btn.innerHTML='<span class="spin" style="width:10px;height:10px"></span> '+esc(old); }
    try{ var r=await api('blog-agent-admin.php',payload); toast(r.message||'Done.','good'); if(reload!==false) renderBlogAgent(m); return r; }
    catch(e){ toast(e.message,'bad'); if(btn){ btn.disabled=false; btn.textContent=old; } }
  };
  $('#ba-save',m).addEventListener('click',function(){ call({action:'settings',engine:engine,slots:times,gemini_key:$('#ba-key',m).value.trim(),groq_key:$('#ba-gkey',m).value.trim(),model:$('#ba-model',m).value.trim()},this); });
  m.querySelectorAll('[data-rmkey]').forEach(function(b){ b.addEventListener('click',function(){
    var g=b.dataset.rmkey==='gemini';
    if(!confirm('Remove the saved '+(g?'Gemini':'Groq')+' key? The writer then uses only the other key.')) return;
    var p={action:'settings',engine:engine,slots:times}; p[g?'gemini_key':'groq_key']='-'; call(p,b); }); });
  m.querySelectorAll('[data-cover]').forEach(function(b){ b.addEventListener('click',function(){ call({action:'cover',id:b.dataset.cover},b).then(function(r){
    if(r&&r.image) window.open(r.image,'_blank','noopener'); }); }); });
  var bt=$('#ba-test',m); if(bt) bt.addEventListener('click',function(){ call({action:'test_key'},this,false).then(function(){ bt.disabled=false; bt.textContent='Test the keys'; }); });
  var bw=$('#ba-write',m); if(bw) bw.addEventListener('click',function(){
    if(!confirm('Write the next post now? It takes 1-2 minutes and is scheduled for the next free time.')) return;
    call({action:'write_now'},this);
  });
  [['#ba-fcl','baCluster'],['#ba-fst','baStage'],['#ba-fss','baStatus']].forEach(function(x){ $(x[0],m).addEventListener('change',function(){ S[x[1]]=this.value; S.baAll=false; renderBlogAgent(m); }); });
  m.querySelectorAll('[data-bacl]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); S.baCluster=a.dataset.bacl; S.baStatus='all'; renderBlogAgent(m); }); });
  var all=$('#ba-all',m); if(all) all.addEventListener('click',function(){ S.baAll=true; renderBlogAgent(m); });
  $('#ba-refresh',m).addEventListener('click',function(){ call({action:'plan_refresh'},this); });
  m.querySelectorAll('[data-bas]').forEach(function(b){ b.addEventListener('click',function(){
    if(b.dataset.bas==='delete' && !confirm('Delete this topic from the plan?')) return;
    call({action:'topic',id:b.dataset.id,op:b.dataset.bas},b); }); });
  m.querySelectorAll('[data-bae]').forEach(function(b){ b.addEventListener('click',function(){
    var tr=b.closest('tr'), t=P.topics.filter(function(x){ return x.id===b.dataset.bae; })[0];
    tr.cells[0].innerHTML='<input type="text" class="ba-et" value="'+esc(t.title)+'" style="width:100%;margin-bottom:4px"><input type="text" class="ba-ek" value="'+esc(t.keyword)+'" style="width:100%" placeholder="Focus keyword">';
    tr.cells[1].innerHTML='<select class="ba-es">'+['tofu','mofu','bofu'].map(function(s){ return '<option value="'+s+'"'+(t.stage===s?' selected':'')+'>'+STAGE_NAMES[s][0]+'</option>'; }).join('')+'</select>';
    tr.cells[3].innerHTML='<button class="btn sm primary">✓ Save</button>';
    tr.cells[3].firstChild.addEventListener('click',function(){ call({action:'topic',id:t.id,op:'save',title:$('.ba-et',tr).value,keyword:$('.ba-ek',tr).value,stage:$('.ba-es',tr).value},this); });
  }); });
  $('#ba-add',m).addEventListener('click',function(){ call({action:'topic_add',pillar:$('#ba-ncl',m).value,stage:$('#ba-nst',m).value,title:$('#ba-nti',m).value,keyword:$('#ba-nkw',m).value},this); });
  $('#ba-new',m).addEventListener('click',async function(){
    if(d.active && !confirm('Make a new token? The PC will need the new one; the old one stops working.')) return;
    try{ var r=await api('blog-agent-admin.php',{action:'new_token'}); toast(r.message,'good'); renderBlogAgent(m, r.token); }catch(e){ toast(e.message,'bad'); }
  });
  var off=$('#ba-off',m);
  if(off) off.addEventListener('click',async function(){
    if(!confirm('Switch the PC token off? Scheduled posts stay scheduled.')) return;
    try{ var r=await api('blog-agent-admin.php',{action:'revoke'}); toast(r.message,'good'); renderBlogAgent(m); }catch(e){ toast(e.message,'bad'); }
  });
  var cp=$('#ba-copy',m);
  if(cp) cp.addEventListener('click',function(){
    var t=$('#ba-cmd',m).textContent;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ toast('Copied.','good'); },function(){ toast('Select the line and copy it.','bad'); });
  });
}

    if(!d.history.length){ box.innerHTML='<div class="hint">No earlier versions in the last 30 days.</div>'; return; }
    var show=function(v){ var t=typeof v==='string'?v:JSON.stringify(v,null,1); return '<pre style="white-space:pre-wrap;max-height:140px;overflow:auto;font-size:11.5px;background:var(--panel-2);padding:8px;border-radius:8px;margin:4px 0">'+esc(String(t).slice(0,3000))+'</pre>'; };

      '<b>✎</b> changes a redirect, <b>✕</b> stops it: the old address opens again and goes back in the sitemap. A redirect the website already has can be sent somewhere else with <b>✎ Change</b> (your rule is used instead). '+

      own.map(viewRow).join('')+(own.length?'':editRow({from:'',to:'',type:301}))+'</tbody></table><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" type="button" id="rr-add">＋ Add redirect</button>'+saveBtn()+'</div></form></div></div>'+sysRedirects+histCard;
    var collect=function(){ return [].map.call(m.querySelectorAll('[data-rr]'),function(tr){

      m.querySelectorAll('[data-rstop]').forEach(function(b){ b.onclick=function(){ var r=own[+b.dataset.rstop];
        if(!confirm('Stop the redirect from '+r.from+'?\n\nThat address opens again (if the page exists) and goes back in the sitemap. You can undo it in "Earlier versions".')) return;
        b.closest('tr').remove(); save('redirects',collect()); }; });
    };
    bind();

    m.querySelectorAll('[data-sysrd]').forEach(function(b){ b.addEventListener('click',function(){ var r=sys.redirects[+b.dataset.sysrd];
      $('#rr-body',m).insertAdjacentHTML('beforeend',editRow({from:r.from,to:r.to,type:r.type,note:'replaces the website\'s own redirect'})); bind(); S.dirty=true;

      toast('Write the new address in "To" and press Save.','good'); }); });
    $('#stf',m).addEventListener('input',function(){ S.dirty=true; });

  if(tab==='noindex'){

      '<div class="card"><div class="chead"><h3>Your noindex pages ('+list.length+')</h3></div><div class="cbody">'+
      (list.length?'<table class="list" style="margin-bottom:12px"><tbody>'+list.map(function(x,i){
        return '<tr data-ni="'+i+'"><td class="t-slug">'+esc(x)+'</td><td style="text-align:right;white-space:nowrap"><a class="btn sm" href="'+esc(x.replace(/\*$/,''))+'" target="_blank" rel="noopener">View ↗</a> '+
          '<button class="btn sm" type="button" data-niedit="'+i+'" title="Edit">✎</button> <button class="btn sm" type="button" data-nidel="'+i+'" title="Take noindex off">✕</button></td></tr>'; }).join('')+'</tbody></table>':
        '<div class="hint" style="margin-bottom:10px">None yet.</div>')+
      '<div style="display:flex;gap:8px"><input type="text" id="st-noindex" list="ni-pages" placeholder="/page-address/" style="flex:1" spellcheck="false"><button class="btn primary" type="button" id="ni-add">Add</button></div>'+
      '<datalist id="ni-pages"></datalist></div></div>'+sysNoindex+histCard;
    var put=function(next){ save('noindex',next); };
    $('#ni-add',m).addEventListener('click',function(){ var v=$('#st-noindex',m).value.trim(); if(!v){ $('#st-noindex',m).focus(); return; }
      if(v.indexOf('http')===0) v=v.replace(/^https?:\/\/[^/]+/,''); if(v.charAt(0)!=='/') v='/'+v; if(!/\*$/.test(v) && !/\/$/.test(v) && v.indexOf('.')===-1) v+='/';
      put(list.concat([v])); });
    $('#st-noindex',m).addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); $('#ni-add',m).click(); } });
    m.querySelectorAll('[data-nidel]').forEach(function(b){ b.addEventListener('click',function(){ var x=list[+b.dataset.nidel];
      if(!confirm('Take noindex off '+x+'?\n\nGoogle may show it again and it goes back in the sitemap.')) return;

    m.querySelectorAll('[data-niedit]').forEach(function(b){ b.addEventListener('click',function(){ var i=+b.dataset.niedit, tr=b.closest('tr');
      tr.innerHTML='<td><input type="text" value="'+esc(list[i])+'" style="width:100%"></td><td style="text-align:right"><button class="btn sm primary" type="button">✓ Save</button></td>';
      var inp=tr.querySelector('input'); inp.focus();
      tr.querySelector('button').addEventListener('click',function(){ var c=list.slice(); c[i]=inp.value.trim(); put(c.filter(Boolean)); }); }); });
    m.querySelectorAll('[data-idx]').forEach(function(b){ b.addEventListener('click',async function(){
      if(!confirm('Take noindex off this page? Google may show it again and it goes back in the sitemap.')) return;

    api('page-metas.php').then(function(x){ var dl=$('#ni-pages',m); if(!dl) return;

  }

    box.innerHTML='<div class="alert info">'+(tab==='robots'
      ?'robots.txt tells search engines and AI crawlers what they may visit. Keep the <code>Sitemap:</code> line. A rule that blocks the whole site is refused.'

      '<div class="card"><div class="cbody"><form id="stf"><div class="field"><label for="st-file">'+file+'</label>'+
      '<textarea id="st-file" rows="18" spellcheck="false" style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:pre">'+esc(d[tab]||'')+'</textarea></div>'+saveBtn()+'</form></div></div>'+histCard;
    $('#stf',m).addEventListener('input',function(){ S.dirty=true; });
    $('#stf',m).addEventListener('submit',function(e){ e.preventDefault(); save(tab,$('#st-file',m).value); });
  }

/* -------------------------------------------------------------- sitemap */
/* Live sitemaps (read from the site), plus addresses to leave out or add. */

async function renderSitemapView(m){
  m.innerHTML=head('Sitemap','What Google gets in /sitemap.xml','<a class="btn" href="/sitemap.xml" target="_blank" rel="noopener">Open sitemap.xml ↗</a>')+
    '<div class="body"><div class="card"><div class="empty"><span class="spin"></span></div></div></div>';
  var d, maps=[];
  try{ d=await api('site-settings.php'); }catch(e){ toast(e.message,'bad'); return; }
  try{
    var idx=new DOMParser().parseFromString(await (await fetch('/sitemap.xml',{cache:'no-store'})).text(),'application/xml');
    var locs=[].map.call(idx.getElementsByTagName('loc'),function(n){ return n.textContent.trim(); });
    for(var i=0;i<locs.length;i++){
      var x=new DOMParser().parseFromString(await (await fetch(locs[i].replace(/^https?:\/\/[^/]+/,''),{cache:'no-store'})).text(),'application/xml');
      maps.push({url:locs[i], urls:[].map.call(x.getElementsByTagName('url'),function(u){
        var l=u.getElementsByTagName('loc')[0], mo=u.getElementsByTagName('lastmod')[0], t=u.getElementsByTagNameNS('*','title')[0];
        return {loc:l?l.textContent.trim():'', mod:mo?mo.textContent.trim():'', title:t?t.textContent.trim():''}; })});
    }
  }catch(e){ toast('Could not read the live sitemaps: '+e.message,'bad'); }
  if(S.view!=='sitemap') return;
  var total=maps.reduce(function(a,x){ return a+x.urls.length; },0), sm=d.sitemap||{exclude:[],extra:[]};
  $('.body',m).innerHTML=
    '<div class="dstats">'+maps.map(function(x){ var n=x.url.replace(/^.*\/sitemaps\//,'').replace('.xml','');
      return '<div class="dstat"><div class="l">'+esc(n)+'</div><div class="n">'+x.urls.length+'</div><div class="s"><a href="'+esc(x.url)+'" target="_blank" rel="noopener">open ↗</a></div></div>'; }).join('')+
      '<div class="dstat hero"><div class="l">All addresses</div><div class="n">'+total+'</div><div class="s">updated automatically</div></div></div>'+
    '<div class="alert info">Sitemaps are built automatically: new blog posts, products and pages appear by themselves, and pages set to noindex never appear. '+
    'Below you can leave addresses out or add pages the scan cannot see. Then submit <code>https://runonconsole.com/sitemap.xml</code> once in Google Search Console and Bing Webmaster Tools.</div>'+
    '<div class="card"><div class="chead"><h3>Rules</h3><span class="note">Kept 30 days in the history</span></div><div class="cbody"><form id="smf">'+
      '<div class="field"><label for="st-exclude">Leave out of the sitemaps</label><textarea id="st-exclude" rows="5" spellcheck="false" placeholder="/products/old-mouse/&#10;/blogs/test-*" style="font-family:ui-monospace,Consolas,monospace">'+esc((sm.exclude||[]).join('\n'))+'</textarea></div>'+
      '<div class="field"><label for="st-extra">Add pages (one per line: /address/ | Page name)</label><textarea id="st-extra" rows="4" spellcheck="false" placeholder="/my-landing-page/ | My landing page" style="font-family:ui-monospace,Consolas,monospace">'+esc((sm.extra||[]).map(function(e){ return e.path+(e.title?' | '+e.title:''); }).join('\n'))+'</textarea></div>'+
      '<button class="btn primary" type="submit">Save rules</button></form></div></div>'+
    '<div class="card"><div class="chead"><h3>Every address in the sitemaps</h3><div class="search" style="max-width:300px"><input type="text" id="smq" placeholder="Search addresses"></div></div>'+
      '<table class="list"><thead><tr><th>Address</th><th>Name</th><th>Sitemap</th><th>Last change</th></tr></thead><tbody id="sm-rows"></tbody></table></div>';
  var all=[]; maps.forEach(function(x){ var n=x.url.replace(/^.*\/sitemaps\//,'').replace('.xml',''); x.urls.forEach(function(u){ all.push([u,n]); }); });
  function draw(){ var q=($('#smq',m).value||'').toLowerCase();
    $('#sm-rows',m).innerHTML=all.filter(function(a){ return !q||(a[0].loc+' '+a[0].title).toLowerCase().indexOf(q)!==-1; }).slice(0,400).map(function(a){
      var p=a[0].loc.replace(/^https?:\/\/[^/]+/,'');
      return '<tr><td class="t-slug"><a href="'+esc(p)+'" target="_blank" rel="noopener">'+esc(p)+'</a></td><td>'+esc(a[0].title)+'</td><td><span class="tag ro">'+esc(a[1])+'</span></td><td class="hint">'+esc((a[0].mod||'').slice(0,10))+'</td></tr>'; }).join(''); }
  draw(); $('#smq',m).addEventListener('input',draw);
  $('#smf',m).addEventListener('submit',async function(e){ e.preventDefault();
    var extra=$('#st-extra',m).value.split('\n').map(function(l){ var p=l.split('|'); return {path:(p[0]||'').trim(), title:(p.slice(1).join('|')||'').trim()}; }).filter(function(x){ return x.path; });
    try{ var r=await api('site-settings.php',{part:'sitemap',value:{exclude:$('#st-exclude',m).value, extra:extra}}); toast(r.message,'good'); renderSitemapView(m); }catch(err){ toast(err.message,'bad'); }
  });
}

async function renderNavEditor(m){

    '<div class="body narrow"><div class="card"><div class="empty"><span class="spin"></span></div></div></div>';

  var N=JSON.parse(JSON.stringify(d.nav)), icons=d.nav_icons||[];
  var body=$('.body',m);
  var icoSel=function(path,val){ return '<select data-p="'+path+'" style="width:110px">'+icons.map(function(i){ return '<option'+(i===val?' selected':'')+'>'+esc(i)+'</option>'; }).join('')+'</select>'; };
  var inp=function(path,val,ph,w){ return '<input type="text" data-p="'+path+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"'+(w?' style="width:'+w+'"':'')+'>'; };

    '<button class="btn sm" type="button" data-rm="'+path+'|'+i+'" title="Remove">✕</button></span>'; };

  function set(path,val){ var ks=path.split('.'), o=N; for(var i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=val; }

  function draw(){

    body.innerHTML=
      '<div class="alert info">Changes go live on <b>every page</b> when you press <b>Save</b>. Links can be a page on this site (<code>/products/</code>) or a full https:// address. '+
      (d.nav_custom?'You are using your own menu. ':'This is the website\'s own menu: edit it and save to make it yours. ')+'Every earlier version is kept for 30 days.</div>'+
      // logo
      '<div class="card"><div class="chead"><h3>Logo</h3></div><div class="cbody">'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>First word(s)</label>'+inp('logo.line1',L.line1,'RUN ON')+'</div>'+

        '<div class="field"><label>Logo picture (optional)</label>'+inp('logo.image',L.image,'/uploads/my-logo.png — copy the link from the Media library')+'<div class="hint">Square picture; leave empty to keep the green controller icon.</div></div>'+
      '</div></div>'+
      // header
      '<div class="card"><div class="chead"><h3>Header menu</h3><span class="note">'+H.length+' items</span></div><div class="cbody">'+
        H.map(function(it,i){
          var P='header.'+i, kids=it.children||[];
          return '<div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px">'+
            '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="min-width:20px">'+(i+1)+'</b>'+inp(P+'.label',it.label,'LABEL','160px')+inp(P+'.url',it.url,'/page/','220px')+
              '<label style="display:flex;gap:6px;align-items:center;font-size:12.5px"><input type="checkbox" data-dd="'+i+'"'+(kids.length?' checked':'')+'> Dropdown</label>'+tools('header',i,H.length)+'</div>'+
            (kids.length?'<div style="margin:10px 0 0 28px">'+kids.map(function(c,j){ var C=P+'.children.'+j;
                return '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px">'+icoSel(C+'.icon',c.icon)+inp(C+'.title',c.title,'Title','150px')+inp(C+'.desc',c.desc,'Short description','230px')+inp(C+'.url',c.url,'/page/','170px')+tools(P+'.children',j,kids.length)+'</div>'; }).join('')+
              '<button class="btn sm" type="button" data-add="'+P+'.children">＋ Dropdown link</button>'+
              '<div style="display:flex;gap:6px;align-items:center;margin-top:8px"><span class="hint">Button at the bottom:</span>'+inp(P+'.button.label',(it.button||{}).label,'View all →','180px')+inp(P+'.button.url',(it.button||{}).url,'/page/','170px')+'</div></div>':'')+
          '</div>';
        }).join('')+

      // footer

    return '<li style="font-size:13px;margin:3px 0">'+(c.ok===true?'<b style="color:#059669">✓</b>':c.ok===false?'<b style="color:#e11d48">✗</b>':'<b style="color:var(--ink-3)">?</b>')+' '+esc(c.label)+
      (c.ok===false?' <span class="hint">(installer not run yet)</span>':'')+'</li>';
  }).join('')+'</ul>';
}

async function liveVersionCard(m){

  var cats={}; all.forEach(function(p){ var c=p.category||'Other'; (cats[c]=cats[c]||[]).push(p); });
  var q='', cat='all';
  var body=$('.body',m);
  body.innerHTML='<div class="hint" style="margin-bottom:12px">'+all.length+' products in '+Object.keys(cats).length+
    ' categories. Live products have their own page, an Amazon button and a place in the sitemap. Hidden products return &ldquo;not found&rdquo; and leave the sitemap.</div>'+
    '<div class="card"><div class="cbody" style="display:flex;gap:10px;flex-wrap:wrap">'+
      '<input type="search" id="pr-q" placeholder="Search products or brands…" style="flex:1;min-width:200px">'+
      '<select id="pr-c"><option value="all">All categories ('+all.length+')</option>'+Object.keys(cats).map(function(c){
        return '<option value="'+esc(c)+'">'+esc(c)+' ('+cats[c].length+')</option>'; }).join('')+'</select></div></div>'+
    '<div id="pr-list"></div>';
  function draw(){
    var list=all.filter(function(p){
      if(cat!=='all' && (p.category||'Other')!==cat) return false;
      return !q || ((p.title||'')+' '+(p.category||'')).toLowerCase().indexOf(q)>=0;
    });
    $('#pr-list',m).innerHTML='<div class="card"><table class="list"><thead><tr><th>Product</th><th>Category</th><th>Amazon</th><th>On website</th></tr></thead><tbody>'+
      (list.map(function(p){
        var slug=p.slug||p.id, live=p.status==='published';
        return '<tr><td><div class="t-title">'+esc(p.title)+
          (can('products','edit')?' <button class="btn sm ghost" data-pr-edit="'+esc(p.id)+'">Edit</button>':'')+'</div>'+
          '<div class="t-slug"><a href="/products/'+esc(slug)+'/" target="_blank" rel="noopener">/products/'+esc(slug)+'/ ↗</a></div></td>'+
          '<td>'+esc(p.category||'')+'</td>'+
          '<td>'+(p.affiliate_amazon?'<a href="'+esc(p.affiliate_amazon)+'" target="_blank" rel="noopener">Open ↗</a>':'<span style="color:#e11d48">missing</span>')+'</td>'+
          '<td style="white-space:nowrap"><span class="tag '+(live?'published':'draft')+'">'+(live?'Live':'Hidden')+'</span> '+
            (canPub?'<button class="btn sm" data-pr-toggle="'+esc(p.id)+'">'+(live?'Hide':'Show')+'</button>':'')+'</td></tr>';
      }).join('')||'<tr><td colspan="4" class="empty">No products match.</td></tr>')+'</tbody></table></div>';
  }
  var nb=$('#pr-new',m); if(nb) nb.addEventListener('click',function(){ openProductEditor(null); });
  $('#pr-list',m).addEventListener('click',async function(e){
    var ed=e.target.closest('[data-pr-edit]'); if(ed){ openProductEditor(ed.dataset.prEdit); return; }
    var b=e.target.closest('[data-pr-toggle]'); if(!b) return;
    var p=all.filter(function(x){return String(x.id)===b.dataset.prToggle;})[0]; if(!p) return;
    var show=p.status!=='published';
    if(!show && !confirm('Hide "'+p.title+'" from the website? Its page will show "not found" and it leaves the sitemap until you show it again.')) return;
    b.disabled=true;
    try{
      var r=await api('products.php',{action:'set_status',id:p.id,version:p.version,status:show?'published':'draft'});

  $('#pr-c',m).addEventListener('change',function(e){ cat=e.target.value; draw(); });

}

var SHARED_PHOTOS=['/images/cyber_keyboard.jpg','/images/tactical_headset.jpg','/images/apex_mouse.jpg',
                   '/images/streaming_vr_gear.jpg','/images/gaming_monitor.jpg','/images/battlestation_pc.jpg'];
function hasRealPhoto(p){ return !!p.image && SHARED_PHOTOS.indexOf(p.image)===-1; }
function shownImage(p){ return hasRealPhoto(p)?p.image:'/images/products/'+p.slug+'.webp'; }

/* What a pasted value contains: SiteStripe HTML, an image link or an Amazon product link. */
function readPaste(v){
  v=String(v||'').trim(); var out={img:'',link:''};
  if(!v) return out;
  if(v.indexOf('<')!==-1){ var r=parseSiteStripe(v); out.img=r.img; out.link=r.link; return out; }
  if(/^https:\/\/[^\s"<>]+\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(v) || /^https:\/\/(m\.media-amazon\.com|images-na\.ssl-images-amazon\.com|ws-na\.amazon-adsystem\.com)\//i.test(v)) out.img=v;
  else if(/^https?:\/\/([^\/]+\.)?(amazon\.[a-z.]+|amzn\.to|a\.co)\//i.test(v)) out.link=v;
  return out;
}

  try{ PRODUCT_CATS=(await api('products.php?categories=1')).categories||[]; }catch(e){ PRODUCT_CATS=[]; }
  return PRODUCT_CATS;

function jsonList(v){ if(!v) return []; if(typeof v!=='string') return v; try{ var d=JSON.parse(v); return d||[]; }catch(e){ return []; } }

/* Amazon product code (ASIN) from any amazon.* product link, or ''. */
function asinOf(url){
  var m=String(url||'').match(/^https?:\/\/([^\/]+)(\/[^?#]*)/i);
  if(!m || !/(^|\.)amazon\.[a-z.]+$/i.test(m[1])) return '';
  var a=(m[2]+'/').match(/\/(?:dp|gp\/product|gp\/aw\/d|product|ASIN)\/([A-Z0-9]{10})[\/]/i);
  return a?a[1].toUpperCase():'';
}

function amazonNote(url){
  url=String(url||'').trim();
  if(!url) return '<span style="color:var(--amber)">▲ No link: the button opens an Amazon search for the product name.</span>';
  var asin=asinOf(url);
  if(asin) return '<span style="color:var(--brand)">✓ Exact product '+esc(asin)+'</span> — saved as amazon.com/dp/'+esc(asin)+'; your store tag is added on the website.';
  if(/^https?:\/\/(amzn\.to|a\.co)\//i.test(url)) return '<span style="color:var(--brand)">✓ Amazon short link</span> — make sure it was created with your store ID.';
  if(/\/s\?|[?&]k=/.test(url)) return '<span style="color:var(--amber)">▲ This is a search page, not one product.</span> Open the product on Amazon and copy that link.';
  return '<span style="color:var(--amber)">▲ No product code found in this link.</span>';
}

/* Pull the image and the product link out of Amazon SiteStripe "Image" / "Text+Image" HTML. */
function parseSiteStripe(html){
  // DOMParser builds an inert document: no scripts or onerror handlers run, nothing loads.
  var box=new DOMParser().parseFromString(String(html||''),'text/html');
  var out={img:'',link:''};
  box.querySelectorAll('img').forEach(function(i){
    var src=i.getAttribute('src')||'';
    if(out.img || /\/e\/ir\?|[?&]o=1&a=/.test(src) || i.getAttribute('width')==='1') return;   // skip the 1x1 tracking pixel
    if(src.indexOf('//')===0) src='https:'+src;
    if(/^https:\/\//i.test(src)) out.img=src;
  });
  var a=box.querySelector('a[href]'); if(a) out.link=a.getAttribute('href');
  return out;
}

  v.className='veil';
  v.innerHTML='<div class="modal'+(wide?' wide':'')+'">'+
    '<div class="mhead"><h3>'+esc(title)+'</h3></div>'+
    '<div class="mbody">'+body+'</div>'+
    '<div class="mfoot">'+actions+'</div></div>';
  document.body.appendChild(v);
  v.addEventListener('click',function(e){ if(e.target===v){ closeModal(); if(handler) handler('close',closeModal); } });
  v.querySelectorAll('[data-a]').forEach(function(b){
    b.addEventListener('click',function(){ handler(b.dataset.a, closeModal); });
  });
  document.addEventListener('keydown', escClose);
}
function escClose(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){ var v=$('.veil'); if(v) v.remove(); document.removeEventListener('keydown',escClose); }

/* ----------------------------------------------------------------- boot */

async function load(){
  try{
    var [b,md] = await Promise.all([
      can('blogs','view') ? api('blogs.php').catch(function(){ return {blogs:[]}; }) : {blogs:[]},
      can('media','view') ? api('media.php?usage=0').catch(function(){ return {media:[]}; }) : {media:[]},
      can('pages','view') ? api('pages.php').catch(function(){ return {pages:[]}; }) : {pages:[]}
    ]).then(function(r){ S.pages=(r[2]&&r[2].pages)||[]; return r; });
    S.blogs=b.blogs||[]; S.media=prepMedia(md.media);
    if(location.hash==='#messages') S.view='messages';
    if(S.user.role==='administrator') loadMessages().then(function(){ if(!S.editing && !document.querySelector('.veil') && S.view!=='messages') renderShell(); });
    loadProdNames().then(function(){ if(S.view==='dashboard'&&!S.editing) renderShell(); });
    renderShell();
    startActivityPolling();
    // How many pages the website already has (for the Pages count in the sidebar).
    if(can('pages','view')) api('site-pages.php').then(function(d){ S.sitePagesN=(d.pages||[]).length;
      var c=document.querySelector('[data-go="cmspages"] .ct'); if(c) c.textContent=S.pages.length+S.sitePagesN; }).catch(function(){});
  }catch(e){
    app.innerHTML='<div class="gate"><div class="gcard"><h2 style="font-size:18px">Cannot reach the CMS</h2>'+
      '<p style="color:var(--ink-3);font-size:13px">'+esc(e.message)+'</p>'+
      '<button class="btn primary" onclick="location.reload()">Reload</button></div></div>';
  }
}

async function boot(){
  try{
    var d=await api('auth.php');
    if(d && d.authenticated){
      S.user=d.user; S.csrf=d.csrf_token; S.sections=d.sections||[];
      if(S.user.must_change_password) return renderChangePassword(true);
      await load();
    }
    else renderLogin();
  }catch(e){ renderLogin('Could not reach the CMS backend.'); }
}

window.addEventListener('beforeunload',function(e){ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
