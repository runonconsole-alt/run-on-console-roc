<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Icon Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent Lines -->
  <path d="M0 270 H1080 M0 540 H1080 M0 810 H1080 M270 0 V1080 M540 0 V1080 M810 0 V1080" stroke="#1E293B" stroke-width="2" opacity="0.4"/>
  
  <!-- Ambient Center Glow Circle -->
  <circle cx="540" cy="460" r="320" fill="#10B981" opacity="0.12" filter="blur(60px)"/>

  <!-- Logo Container -->
  <g transform="translate(540, 420)">
    <!-- Squircle Icon Outer Glow & Badge -->
    <rect x="-140" y="-220" width="280" height="280" rx="76" fill="url(#badgeGrad)" filter="url(#emeraldGlow)"/>

    <!-- Controller SVG Icon -->
    <g transform="translate(0, -80) scale(1.7)">
      <!-- Controller Outline -->
      <path d="M-38 -22 C-42 -22 -46 -14 -48 4 C-50 22 -42 38 -28 38 C-20 38 -14 28 -6 18 L6 18 C14 28 20 38 28 38 C42 38 50 22 48 4 C46 -14 42 -22 38 -22 C26 -22 18 -14 0 -14 C-18 -14 -26 -22 -38 -22 Z" 
            fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- D-Pad -->
      <path d="M-24 -6 V14 M-34 4 H-14" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <!-- Action Buttons -->
      <circle cx="24" cy="-2" r="4" fill="#FFFFFF"/>
      <circle cx="34" cy="8" r="4" fill="#FFFFFF"/>
      <circle cx="14" cy="8" r="4" fill="#FFFFFF"/>
      <circle cx="24" cy="18" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Main Title: RUN ON CONSOLE -->
    <text x="0" y="150" font-family="'Orbitron', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="64" text-anchor="middle" letter-spacing="4">
      <tspan fill="#FFFFFF">RUN ON </tspan>
      <tspan fill="url(#textGrad)">CONSOLE</tspan>
    </text>

    <!-- Tagline: THE GAMING & HARDWARE HUB -->
    <text x="0" y="210" font-family="'Consolas', 'Courier New', monospace" font-weight="700" font-size="24" fill="#6EE7B7" text-anchor="middle" letter-spacing="8">
      THE GAMING &amp; HARDWARE HUB
    </text>
  </g>
</svg>
